name: Build Unsigned iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Ermöglicht manuelles Starten per Klick in GitHub

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java (für eventuelle Tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Set up Go (für librclone / gomobile)
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init

      - name: Build librclone framework (Rclone.xcframework)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          bash ios/scripts/build_librclone.sh

      - name: Build iOS App (Unsigned Release)
        run: flutter build ios --release --no-codesign

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r app-release-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-release
          path: app-release-unsigned.ipa
          retention-days: 7