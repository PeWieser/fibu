# VORSCHLAG — von einem Agenten nicht selbst installierbar.
#
# Diese Datei liegt absichtlich NICHT unter .github/workflows/: Der
# Agent-Token hat keine `workflows`-Berechtigung, ein Push dorthin wird mit
# "refusing to allow a GitHub App to create or update workflow ..." abgelehnt.
#
# Installation (einmalig, von dir):
#
#   cp ci/build-ios.proposed.yml .github/workflows/build-ios.yml
#   rm ci/build-ios.proposed.yml
#   git add -A && git commit -m "ci: report failures as commit comments" && git push
#
# Was sich gegenüber der aktuellen Fassung ändert und warum, steht am Ende
# dieser Datei unter "Änderungen".

name: Build Unsigned iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Ermöglicht manuelles Starten per Klick in GitHub

# contents:write        -> IPA-Artefakt hochladen + Commit-Kommentar posten
# pull-requests:write   -> Kommentar-Fallback über die PR-API
# issues:write          -> Kommentar-Fallback über ein Issue
# statuses:write        -> Commit-Status setzen
#
# Hinweis: `permissions` kann nur Rechte abgeben, die die App-Installation
# ohnehin hat. `workflows` fehlt der Installation — deshalb kann der Agent
# diese Datei nicht selbst ändern, wohl aber alles darin benutzen.
permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

# Ein neuer Push auf denselben Branch bricht den noch laufenden Build ab.
# Ein macOS-Lauf kostet ~20 Minuten; abgebrochene Läufe kosten fast nichts.
concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  LOG_DIR: ci-logs

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Prepare log directory
        run: mkdir -p "$LOG_DIR"

      - name: Set up Java (für eventuelle Tools)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Ab hier schreibt jeder Schritt seine Ausgabe zusätzlich in eine eigene
      # Datei. `set -o pipefail` ist Pflicht: ohne es liefert `| tee` immer 0
      # und ein Fehler würde verschluckt.
      - name: Install Flutter Dependencies
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee "$LOG_DIR/10-pub-get.log"

      - name: Analyze (0 Errors, 0 Warnings)
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee "$LOG_DIR/20-analyze.log"

      - name: Set up Go (für librclone / gomobile)
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          # Kein automatisches Modul-Caching: Im Repo-Root existiert keine
          # go.sum (Go läuft nur unter build/librclone), sonst erscheint
          # "Restore cache failed: Dependencies file is not found".
          cache: false

      - name: Install gomobile
        shell: bash
        run: |
          set -o pipefail
          {
            go install golang.org/x/mobile/cmd/gomobile@latest
            go install golang.org/x/mobile/cmd/gobind@latest
            export PATH="$PATH:$(go env GOPATH)/bin"
            gomobile init
          } 2>&1 | tee "$LOG_DIR/30-gomobile.log"

      - name: Build librclone framework (Rclone.xcframework)
        shell: bash
        run: |
          set -o pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          bash ios/scripts/build_librclone.sh 2>&1 | tee "$LOG_DIR/40-librclone.log"

      - name: Build iOS App (Unsigned Release)
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee "$LOG_DIR/50-build-ios.log"

      # Schließt die offene Verifikationslücke aus docs/RECHTS_AUDIT.md (L-13):
      # Ein grüner Build beweist allein nicht, dass das Privacy Manifest im
      # fertigen Bundle liegt — nur ein Eintrag in der Resources-Build-Phase
      # des Runner-Targets tut das. Deshalb hier hart geprüft.
      - name: Verify PrivacyInfo.xcprivacy is bundled
        shell: bash
        run: |
          set -o pipefail
          APP=build/ios/iphoneos/Runner.app
          if [ ! -f "$APP/PrivacyInfo.xcprivacy" ]; then
            echo "::error::PrivacyInfo.xcprivacy fehlt in $APP. Die Datei ist nicht in der Resources-Build-Phase des Runner-Targets eingetragen (ios/Runner.xcodeproj/project.pbxproj)."
            exit 1
          fi
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          echo "Privacy Manifest im Bundle:"
          plutil -p "$APP/PrivacyInfo.xcprivacy"

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r app-release-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-app-release
          path: app-release-unsigned.ipa
          retention-days: 7

      # Läuft bewusst NACH dem Build: Ein roter Test soll die IPA nicht
      # blockieren — aber er soll berichtet werden (siehe nächster Schritt).
      - name: Unit- und Widget-Tests
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee "$LOG_DIR/60-tests.log"

      # -------------------------------------------------------------------
      # Fehlerbericht als Commit-Kommentar.
      #
      # Warum das nötig ist: Step-Logs liegen auf
      # results-receiver.actions.githubusercontent.com und sind aus
      # agentenseitigen Sandboxes nicht erreichbar (TLS-Block, EOF).
      # api.github.com ist erreichbar. Ein Commit-Kommentar ist damit der
      # einzige Kanal, über den ein Fehler ohne menschliches Copy&Paste
      # lesbar wird:
      #
      #   gh api repos/<owner>/<repo>/commits/<sha>/comments
      # -------------------------------------------------------------------
      - name: Report failure as commit comment
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          OUT="$LOG_DIR/_report.md"
          {
            echo "## ❌ Build fehlgeschlagen"
            echo
            echo "Run: <https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}>"
            echo "Commit: \`${{ github.sha }}\`"
            echo
            for f in "$LOG_DIR"/*.log; do
              [ -s "$f" ] || continue
              echo "### \`${f##*/}\` (letzte 200 Zeilen)"
              echo '```'
              tail -n 200 "$f"
              echo '```'
              echo
            done
          } > "$OUT"

          # GitHub begrenzt einen Kommentar auf 65.536 Zeichen.
          if [ "$(wc -c < "$OUT")" -gt 60000 ]; then
            head -c 60000 "$OUT" > "$OUT.tmp" && mv "$OUT.tmp" "$OUT"
            printf '\n```\n(gekürzt)\n' >> "$OUT"
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/commits/${{ github.sha }}/comments" \
               -f body="$(cat "$OUT")" > /dev/null; then
            echo "Fehlerbericht als Commit-Kommentar gepostet."
          else
            echo "::warning::Commit-Kommentar konnte nicht gepostet werden — Permissions prüfen (contents: write)."
          fi

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

# ---------------------------------------------------------------------------
# Änderungen gegenüber der aktuellen .github/workflows/build-ios.yml
# ---------------------------------------------------------------------------
# 1. `permissions:` ergänzt. Ohne `contents: write` kann der Berichtsschritt
#    keinen Commit-Kommentar posten.
# 2. `concurrency:` ergänzt — neuer Push bricht den alten Lauf ab.
# 3. Jeder `run:`-Schritt schreibt per `tee` nach `ci-logs/NN-name.log` und
#    setzt `set -o pipefail`. Ohne pipefail würde `| tee` jeden Fehler
#    verschlucken.
# 4. Neuer Schritt „Verify PrivacyInfo.xcprivacy is bundled" — prüft, dass das
#    Datenschutz-Manifest wirklich im fertigen .app liegt (Audit L-13).
# 5. Neuer Schritt „Report failure as commit comment" (`if: failure()`) —
#    sammelt alle Step-Logs und postet sie als Commit-Kommentar. Das ist der
#    eigentliche Zweck der Übung.
# 6. Neuer Schritt „Upload CI logs" (`if: always()`).
# 7. Reihenfolge unverändert: Tests bleiben hinter dem Build.
# 8. Nichts am Build selbst geändert — gleiche Flutter-/Go-Versionen, gleiche
#    IPA, gleiches Artefakt.
