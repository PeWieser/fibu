name: fibu
description: "Fibu - Multi-Cloud-Backup App for Media Files"
publish_to: 'none'

version: 1.0.0+1

environment:
  # Flutter 3.47 buendelt Dart 3.13 und verlangt mindestens iOS 15 — beides
  # passt zum Deployment-Target dieser App. Die Untergrenze wird auf 3.9.0
  # angehoben, weil cupertino_native_better das voraussetzt.
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  fluent_ui: ^4.8.0
  flutter_riverpod: ^2.5.1
  cupertino_icons: ^1.0.8
  path: ^1.9.0
  file_picker: ^11.0.3
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1
  permission_handler: ^13.0.1
  photo_manager: ^3.12.0
  # Opens locally-cached remote files with the system handler (Quick Look on iOS).
  open_filex: ^4.5.0
  # In-app browser for cloud provider OAuth (Google Drive, OneDrive, Dropbox, ...).
  flutter_web_auth_2: ^4.1.0
  # Native iOS-Controls (UITabBar, UISlider, UISwitch, UISegmentedControl,
  # UIButton) als Platform Views. Flutter unterstuetzt Liquid Glass nicht und
  # wird es laut flutter/flutter#170310 auch nicht; native Controls sind nur
  # ueber Platform Views erreichbar. Benoetigt iOS 15+.
  cupertino_native_better: ^1.5.4
  # NOTE: No secure-storage plugin on purpose — iOS uses the native Apple
  # Keychain directly via the `fibu/keychain` MethodChannel (see
  # lib/core/services/secure_store_service.dart).
  # Background execution for scheduled syncs (BGTaskScheduler on iOS / WorkManager on Android).
  workmanager: ^0.5.2
  # iOS Home-Screen Quick Actions (long press app icon -> "Jetzt synchronisieren").
  quick_actions: ^1.1.0
  # Geraet-zu-Geraet-Uebertragung der Konfiguration im lokalen Netz.
  # Reines Dart ohne nativen Anteil — deshalb kein eigenes Privacy Manifest
  # und keine Aenderung an docs/RECHTS_AUDIT.md (L-13).
  #   cryptography -> AES-256-GCM fuer das Bundle (enthaelt Cloud-Zugangsdaten)
  #
  # qr_flutter ist raus: Die Kopplung laeuft ueber die automatische Erkennung
  # im lokalen Netz (UDP-Beacon, Port 47831). Ein QR-Code waere ein zweiter
  # Weg zum selben Ziel gewesen — und ein Kamera-Scanner dafuer haette eine
  # native Abhaengigkeit plus Kamera-Berechtigung aufgemacht.
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # flutter_web_auth_2, open_filex und workmanager unterstützen noch kein
  # Swift Package Manager — Flutter fällt für sie ohnehin auf CocoaPods
  # zurück. SPM projektweit deaktivieren = reines CocoaPods (bisheriges,
  # grün gebautes Verhalten) und keine Build-Warnung mehr. Entfernen, sobald
  # alle drei Plugins SPM können.
  config:
    enable-swift-package-manager: false
