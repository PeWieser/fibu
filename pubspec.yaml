name: fibu
description: "Fibu - Multi-Cloud-Backup App for Media Files"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  fluent_ui: ^4.8.0
  flutter_riverpod: ^2.5.1
  cupertino_icons: ^1.0.8
  path: ^1.9.0
  file_picker: ^11.0.3
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1
  permission_handler: ^13.0.1
  photo_manager: ^3.12.0
  # Opens locally-cached remote files with the system handler (Quick Look on iOS).
  open_filex: ^4.5.0
  # In-app browser for cloud provider OAuth (Google Drive, OneDrive, Dropbox, ...).
  flutter_web_auth_2: ^4.1.0
  # NOTE: No secure-storage plugin on purpose — iOS uses the native Apple
  # Keychain directly via the `fibu/keychain` MethodChannel (see
  # lib/core/services/secure_store_service.dart).
  # Background execution for scheduled syncs (BGTaskScheduler on iOS / WorkManager on Android).
  workmanager: ^0.5.2
  # iOS Home-Screen Quick Actions (long press app icon -> "Jetzt synchronisieren").
  quick_actions: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
